version: '3.8'

services:
  # Python AI Service
  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: smart_canteen_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  # Backend Express API & WebSockets
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: smart_canteen_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=smart-canteen-enterprise-super-secret-key-2026
      - NODE_ENV=production
    depends_on:
      - ai-service
    restart: always

  # React Web Frontend
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: smart_canteen_web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: always

networks:
  default:
    name: canteen_network
